# Codex: Sol High orchestrator + Luna Max subagents.
# Adapted from donvito/codex-astra-luna-orchestrator by LSthemagic.
# Install at <project>/.codex/config.toml, or merge into ~/.codex/config.toml.
# Named roles in agents/*.toml are explicitly pinned to Luna Max as well.
# Profile names pro/plus are compatibility aliases, not subscription checks.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true
# Concurrent child threads only; the root does not count toward this limit.
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
